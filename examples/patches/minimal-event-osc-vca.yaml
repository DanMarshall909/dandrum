metadata:
  name: Minimal Event Oscillator VCA
  version: "0.1"
ports:
  - name: left
    direction: output
    signal: audio
    channels: 1
    maps_from: vca.audio_out
  - name: right
    direction: output
    signal: audio
    channels: 1
    maps_from: vca.audio_out
modules:
  - id: midi
    type: midi_input
  - id: osc
    type: oscillator
  - id: env
    type: adsr
  - id: vca
    type: gain
connections:
  - from: midi.events
    to: env.gate
  - from: osc.audio
    to: vca.audio_in
  - from: env.value
    to: vca.gain