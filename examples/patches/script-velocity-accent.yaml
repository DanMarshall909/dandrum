metadata:
  name: Script Velocity Accent
ports:
  - { name: accent, direction: output, signal: control, channels: 1, maps_from: accent_mapper.accent }
module_definitions:
  - type: velocity_accent
    implementation: script
    static_params:
      - { name: language, type: enum, default: rhai, allowed_values: [rhai] }
      - { name: source, type: string }
    ports:
      - { name: events, direction: input, signal: event, channels: 1 }
      - { name: accent, direction: output, signal: control, channels: 1 }
modules:
  - id: midi
    type: midi_input
  - id: accent_mapper
    type: velocity_accent
    static:
      source: |
        fn process(ctx) {
          for event in ctx.events {
            if event.type == "note_on" {
              ctx.control("accent", event.velocity / 127.0);
            }
          }
        }
connections:
  - from: midi.events
    to: accent_mapper.events
