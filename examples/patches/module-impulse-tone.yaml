metadata:
  name: Composite Impulse Tone
ports:
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: voices.audio }
module_definitions:
  - type: impulse_tone
    ports:
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: velocity_gain.audio_out }
    modules:
      - { id: note_controls, type: note_to_control }
      - { id: tone, type: oscillator, static: { channels: 2 } }
      - { id: envelope, type: adsr }
      - { id: envelope_gain, type: gain, static: { channels: 2 } }
      - { id: velocity_gain, type: gain, static: { channels: 2 } }
    connections:
      - { from: voice.gate, to: note_controls.events }
      - { from: note_controls.gate, to: envelope.gate }
      - { from: note_controls.pitch_ratio, to: tone.pitch }
      - { from: tone.audio, to: envelope_gain.audio_in }
      - { from: envelope.value, to: envelope_gain.gain }
      - { from: envelope_gain.audio_out, to: velocity_gain.audio_in }
      - { from: note_controls.velocity, to: velocity_gain.gain }
modules:
  - { id: midi, type: midi_input }
  - id: voices
    type: poly
    static: { definition: impulse_tone, max_voices: 8, allocation: oldest-steal }
connections:
  - { from: midi.events, to: voices.notes }
