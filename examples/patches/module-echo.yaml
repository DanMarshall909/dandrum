metadata:
  name: Composite Echo
  version: "0.1"
ports:
  - { name: in, direction: input, signal: audio, channels: 2, maps_to: delay.audio_in }
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: delay.audio_out }
module_definitions:
  - type: delay_echo
    static_params:
      - { name: channels, type: int, default: 2 }
    ports:
      - { name: audio_in, direction: input, signal: audio, channels: $channels, maps_to: echo.audio_in }
      - { name: time_left_ms, direction: input, signal: control, channels: 1, default: 0.3, maps_to: echo.time_left_ms }
      - { name: time_right_ms, direction: input, signal: control, channels: 1, default: 0.3, maps_to: echo.time_right_ms }
      - { name: feedback, direction: input, signal: control, channels: 1, default: 0.5, maps_to: echo.feedback }
      - { name: damping_cutoff, direction: input, signal: control, channels: 1, default: 0.5, maps_to: echo.damping_cutoff }
      - { name: wet, direction: input, signal: control, channels: 1, default: 0.7, maps_to: echo.wet }
      - { name: dry, direction: input, signal: control, channels: 1, default: 0.5, maps_to: echo.dry }
      - { name: audio_out, direction: output, signal: audio, channels: $channels, maps_from: echo.audio_out }
    modules:
      - { id: echo, type: echo, static: { channels: $channels } }
modules:
  - { id: delay, type: delay_echo, static: { channels: 2 } }
connections: []
