metadata:
  name: Composite Velocity VCA
ports:
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: voices.audio }
module_definitions:
  - type: velocity_vca
    ports:
      - { name: events, direction: input, signal: event, channels: 1, maps_to: note_controls.events }
      - { name: envelope, direction: input, signal: control, channels: 1, default: 1, maps_to: envelope_gain.gain }
      - { name: audio_in, direction: input, signal: audio, channels: 2, maps_to: envelope_gain.audio_in }
      - { name: audio_out, direction: output, signal: audio, channels: 2, maps_from: velocity_gain.audio_out }
    modules:
      - { id: note_controls, type: note_to_control }
      - { id: envelope_gain, type: gain, static: { channels: 2 } }
      - { id: velocity_gain, type: gain, static: { channels: 2 } }
    connections:
      - { from: envelope_gain.audio_out, to: velocity_gain.audio_in }
      - { from: note_controls.velocity, to: velocity_gain.gain }
  - type: velocity_voice
    ports:
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: vca.audio_out }
    modules:
      - { id: source, type: oscillator, static: { channels: 2 } }
      - { id: envelope, type: adsr }
      - { id: vca, type: velocity_vca }
    connections:
      - { from: voice.gate, to: envelope.gate }
      - { from: voice.gate, to: vca.events }
      - { from: envelope.value, to: vca.envelope }
      - { from: source.audio, to: vca.audio_in }
modules:
  - { id: midi, type: midi_input }
  - id: voices
    type: poly
    static: { definition: velocity_voice, max_voices: 8, allocation: oldest-steal }
connections:
  - { from: midi.events, to: voices.notes }
