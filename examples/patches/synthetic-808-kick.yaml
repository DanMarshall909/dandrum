metadata:
  name: Synthetic 808 Kick
instrument:
  id: dandrum.synthetic-808-kick
  preset_schema_version: 1
ports:
  # The old patch exposed tune and punch but mapped them to a computed output
  # and an already-connected gain input. They had no audible effect. Keep the
  # preset names until a separate sound-design change defines their behavior.
  - { name: tune_hz, direction: input, signal: control, channels: 1, default: 48, min: 20, max: 120 }
  - { name: decay_ms, direction: input, signal: control, channels: 1, default: 650, min: 50, max: 2000, maps_to: voices.decay_ms }
  - { name: punch, direction: input, signal: control, channels: 1, default: 0.7, min: 0, max: 1 }
  - { name: click, direction: input, signal: control, channels: 1, default: 1, min: 0, max: 1, maps_to: voices.click }
  - { name: sub_decay_ms, direction: input, signal: control, channels: 1, default: 800, min: 50, max: 2000, maps_to: voices.sub_decay_ms }
  - { name: sub_level, direction: input, signal: control, channels: 1, default: 1, min: 0, max: 1, maps_to: voices.sub_level }
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: voices.audio }
preset_surface:
  parameters:
    - { name: kick.tune_hz, maps_to: tune_hz }
    - { name: kick.decay_ms, maps_to: decay_ms }
    - { name: kick.punch, maps_to: punch }
    - { name: kick.click, maps_to: click }
    - { name: kick.sub_decay_ms, maps_to: sub_decay_ms }
    - { name: kick.sub_level, maps_to: sub_level }
module_definitions:
  - type: kick_voice
    ports:
      - { name: decay_ms, direction: input, signal: control, channels: 1, default: 650, min: 50, max: 2000, maps_to: adsr.decay }
      - { name: click, direction: input, signal: control, channels: 1, default: 1, min: 0, max: 1, maps_to: click_gain.gain }
      - { name: sub_decay_ms, direction: input, signal: control, channels: 1, default: 800, min: 50, max: 2000, maps_to: sub_gain_env.time_ms }
      - { name: sub_level, direction: input, signal: control, channels: 1, default: 1, min: 0, max: 1, maps_to: sub_level_map.scale }
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: voice_mix.mix }
    modules:
      - { id: ntr, type: note_to_control }
      - { id: body_osc, type: oscillator, static: { channels: 2 } }
      - { id: filt, type: filter, static: { algorithm: moog, mode: lowpass, channels: 2 } }
      - { id: adsr, type: adsr, defaults: { sustain: 0, attack: 0 } }
      - { id: vca, type: gain, static: { channels: 2 } }
      - { id: click_impulse, type: impulse, static: { channels: 2 } }
      - { id: click_gain, type: gain, static: { channels: 2 } }
      - { id: pitch_decay, type: decay, static: { curve: exponential }, defaults: { time_ms: 80 } }
      - { id: pitch_map, type: curve_mapper, defaults: { scale: 4.7 } }
      - { id: voice_mix, type: audio_mixer, static: { channels: 2 } }
      - { id: sub_lpf, type: filter, static: { algorithm: biquad, mode: lowpass, channels: 2 }, defaults: { cutoff: 0.3 } }
      - { id: sub_gain_env, type: decay, static: { curve: exponential } }
      - { id: sub_level_map, type: curve_mapper }
      - { id: sub_vca, type: gain, static: { channels: 2 } }
    connections:
      - { from: voice.gate, to: ntr.events }
      - { from: voice.gate, to: adsr.gate }
      - { from: voice.gate, to: click_impulse.trigger }
      - { from: voice.gate, to: pitch_decay.trigger }
      - { from: voice.gate, to: sub_gain_env.trigger }
      - { from: pitch_decay.value, to: pitch_map.value }
      - { from: ntr.pitch_ratio, to: pitch_map.offset }
      - { from: pitch_map.value, to: body_osc.pitch }
      - { from: body_osc.audio, to: filt.audio_in }
      - { from: filt.audio_out, to: vca.audio_in }
      - { from: adsr.value, to: vca.gain }
      - { from: vca.audio_out, to: voice_mix.inputs }
      - { from: click_impulse.audio, to: click_gain.audio_in }
      - { from: click_gain.audio_out, to: voice_mix.inputs }
      - { from: body_osc.audio, to: sub_lpf.audio_in }
      - { from: sub_lpf.audio_out, to: sub_vca.audio_in }
      - { from: sub_gain_env.value, to: sub_level_map.value }
      - { from: sub_level_map.value, to: sub_vca.gain }
      - { from: sub_vca.audio_out, to: voice_mix.inputs }
modules:
  - { id: midi, type: midi_input }
  - id: voices
    type: poly
    static: { definition: kick_voice, max_voices: 1, allocation: reject-new }
connections:
  - { from: midi.events, to: voices.notes }
