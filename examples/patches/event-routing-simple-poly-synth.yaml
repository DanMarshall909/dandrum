metadata:
  name: Event Routing Simple Poly Synth
  version: "0.1"
ports:
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: voices.audio }
module_definitions:
  - type: routed_voice
    ports:
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: vca.audio_out }
    modules:
      # The note filter admits only MIDI 60; this is its legacy C4/A3 pitch ratio.
      - { id: osc, type: oscillator, static: { channels: 2 }, defaults: { pitch: 1.1892070770263672 } }
      - { id: env, type: adsr }
      - { id: vca, type: gain, static: { channels: 2 } }
    connections:
      - { from: voice.gate, to: env.gate }
      - { from: osc.audio, to: vca.audio_in }
      - { from: env.value, to: vca.gain }
modules:
  - { id: midi, type: midi_input }
  - { id: note_route, type: event_filter, static: { selector: note, note: 60 } }
  - id: voices
    type: poly
    static: { definition: routed_voice, max_voices: 4, allocation: oldest-steal }
connections:
  - { from: midi.events, to: note_route.events_in }
  - { from: note_route.events_out, to: voices.notes }
