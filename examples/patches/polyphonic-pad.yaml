metadata:
  name: Polyphonic Pad
  version: "0.1"
ports:
  - { name: notes, direction: input, signal: event, channels: 1, maps_to: voices.notes }
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: reverb.audio_out }
module_definitions:
  - type: pad_voice
    ports:
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: vca.audio_out }
    modules:
      - { id: osc, type: oscillator, static: { channels: 2 } }
      - { id: env, type: adsr }
      - { id: vca, type: gain, static: { channels: 2 } }
    connections:
      - { from: voice.note, to: osc.pitch }
      - { from: voice.gate, to: env.gate }
      - { from: osc.audio, to: vca.audio_in }
      - { from: env.value, to: vca.gain }
modules:
  - id: voices
    type: poly
    static: { definition: pad_voice, max_voices: 8, allocation: oldest-steal }
  - { id: reverb, type: reverb, static: { channels: 2 } }
connections:
  - { from: voices.audio, to: reverb.audio_in }
