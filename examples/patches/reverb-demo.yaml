metadata:
  name: Reverb Demo
  version: "0.1"
ports:
  - name: in
    direction: input
    signal: audio
    channels: 2
    maps_to: reverb.audio_in
  - name: master
    direction: output
    signal: audio
    channels: 2
    maps_from: reverb.audio_out
modules:
  - id: reverb
    type: reverb
    static: { channels: 2 }
connections: []
