metadata:
  name: Envelope Filter Modulation
ports:
  - name: left
    direction: output
    signal: audio
    channels: 1
    maps_from: mixer.mix
  - name: right
    direction: output
    signal: audio
    channels: 1
    maps_from: mixer.mix
modules:
  - id: source
    type: oscillator
  - id: follower
    type: envelope_follower
    static:
      mode: peak
  - id: mapper
    type: curve_mapper
    static:
      curve: s_curve
      steps: 4
  - id: filter
    type: filter
    static:
      algorithm: moog
  - id: mixer
    type: audio_mixer
connections:
  - from: source.audio
    to: follower.audio_in
  - from: follower.value
    to: mapper.value
  - from: mapper.value
    to: filter.cutoff
  - from: source.audio
    to: filter.audio_in
  - from: filter.audio_out
    to: mixer.inputs
