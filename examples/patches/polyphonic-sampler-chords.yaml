metadata:
  name: Polyphonic Sampler Chords
ports:
  - { name: notes, direction: input, signal: event, channels: 1, maps_to: voices.notes }
  - { name: left, direction: output, signal: audio, channels: 1, maps_from: voices.audio }
module_definitions:
  - type: sampler_voice
    ports:
      - { name: audio, direction: output, signal: audio, channels: 1, maps_from: vca.audio_out }
    modules:
      - id: sampler
        type: sampler
        static:
          sample: { kind: sample, path: assets/cello.wav }
      - { id: envelope, type: adsr }
      - { id: vca, type: gain }
    connections:
      - { from: voice.note, to: sampler.rate }
      - { from: voice.gate, to: sampler.trigger }
      - { from: voice.gate, to: envelope.gate }
      - { from: sampler.audio, to: vca.audio_in }
      - { from: envelope.value, to: vca.gain }
modules:
  - id: voices
    type: poly
    static: { definition: sampler_voice, max_voices: 6, allocation: reject-new }
connections: []
