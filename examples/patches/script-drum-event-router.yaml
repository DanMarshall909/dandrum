metadata:
  name: Script Drum Event Router
ports:
  - { name: kick, direction: output, signal: event, channels: 1, maps_from: drum_router.kick }
module_definitions:
  - type: drum_event_router
    implementation: script
    static_params:
      - { name: language, type: enum, default: rhai, allowed_values: [rhai] }
      - { name: source, type: string }
    ports:
      - { name: events, direction: input, signal: event, channels: 1 }
      - { name: kick, direction: output, signal: event, channels: 1 }
      - { name: snare, direction: output, signal: event, channels: 1 }
      - { name: hat, direction: output, signal: event, channels: 1 }
modules:
  - id: midi
    type: midi_input
  - id: drum_router
    type: drum_event_router
    static:
      source: |
        fn process(ctx) {
          for event in ctx.events {
            if event.type == "note_on" {
              if event.note == 36 {
                ctx.emit("kick", event);
              }
              if event.note == 38 {
                ctx.emit("snare", event);
              }
              if event.note == 42 {
                ctx.emit("hat", event);
              }
            }
          }
        }
connections:
  - from: midi.events
    to: drum_router.events
