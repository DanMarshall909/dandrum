metadata:
  name: Composite Hidden Internals
ports:
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: voices.audio }
module_definitions:
  # Patch authors expose this contract; env/osc/vca remain internal.
  - type: plucked_cell
    ports:
      - { name: strike, direction: input, signal: event, channels: 1, maps_to: env.gate }
      - { name: bend, direction: input, signal: control, channels: 1, default: 1, maps_to: osc.pitch }
      - { name: signal, direction: output, signal: audio, channels: 2, maps_from: vca.audio_out }
    modules:
      - { id: osc, type: oscillator, static: { channels: 2 } }
      - { id: env, type: adsr }
      - { id: vca, type: gain, static: { channels: 2 } }
    connections:
      - { from: osc.audio, to: vca.audio_in }
      - { from: env.value, to: vca.gain }
  - type: plucked_voice
    ports:
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: cell.signal }
    modules:
      - { id: cell, type: plucked_cell }
    connections:
      - { from: voice.gate, to: cell.strike }
modules:
  - { id: midi, type: midi_input }
  - id: voices
    type: poly
    static: { definition: plucked_voice, max_voices: 8, allocation: oldest-steal }
connections:
  - { from: midi.events, to: voices.notes }
