metadata:
  name: Script Velocity Map
ports:
  - { name: velocity, direction: output, signal: control, channels: 1, maps_from: velocity_map.velocity }
module_definitions:
  - type: velocity_mapper
    implementation: script
    static_params:
      - { name: language, type: enum, default: rhai, allowed_values: [rhai] }
      - { name: source, type: string }
    ports:
      - { name: notes, direction: input, signal: event, channels: 1 }
      - { name: velocity, direction: output, signal: control, channels: 1 }
      - { name: routed_notes, direction: output, signal: event, channels: 1 }
modules:
  - id: midi
    type: midi_input
  - id: velocity_map
    type: velocity_mapper
    static:
      source: |
        fn process(ctx) {
          for event in ctx.events {
            if event.type == "note_on" {
              ctx.control("velocity", event.velocity / 127.0);
              ctx.emit("routed_notes", event);
            }
          }
        }
connections:
  - from: midi.events
    to: velocity_map.notes
