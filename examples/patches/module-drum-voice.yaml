metadata:
  name: Module Drum Voice
ports:
  - name: left
    direction: output
    signal: audio
    channels: 1
    maps_from: voice.audio
  - name: right
    direction: output
    signal: audio
    channels: 1
    maps_from: voice.audio
modules:
  - id: midi
    type: midi_input
  - id: voice
    type: $LIB/1.0.0/drum_voice/drum_voice.yaml
connections:
  - from: midi.events
    to: voice.trigger
