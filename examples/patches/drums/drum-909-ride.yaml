metadata:
  name: Drum 909 Ride
# A sampler-backed ride using a self-authored placeholder sample.
# Replace the sample with a licensed recording for production use.
instrument:
  id: dandrum.drum-909-ride
  preset_schema_version: 1
ports:
  - { name: level, direction: input, signal: control, channels: 1, default: 0.7, min: 0, max: 2, maps_to: voices.level }
  - { name: left, direction: output, signal: audio, channels: 1, maps_from: voices.audio }
  - { name: right, direction: output, signal: audio, channels: 1, maps_from: voices.audio }
preset_surface:
  parameters:
    - { name: ride.level, maps_to: level }
module_definitions:
  - type: metallic_voice
    ports:
      - { name: level, direction: input, signal: control, channels: 1, default: 0.7, min: 0, max: 2, maps_to: trim.gain }
      - { name: audio, direction: output, signal: audio, channels: 1, maps_from: mixer.mix }
    modules:
      - id: sampler
        type: sampler
        static:
          sample: { kind: sample, path: assets/drums/909/ride.wav }
      - { id: trim, type: gain }
      - { id: mixer, type: audio_mixer }
    connections:
      - { from: voice.gate, to: sampler.trigger }
      - { from: sampler.audio, to: trim.audio_in }
      - { from: trim.audio_out, to: mixer.inputs }
modules:
  - { id: midi, type: midi_input }
  - id: voices
    type: poly
    static: { definition: metallic_voice, max_voices: 1, allocation: reject-new }
connections:
  - { from: midi.events, to: voices.notes }
