metadata:
  name: Drum 909 Kick
# 909-style kick: a tuned sine body with a fast pitch sweep, an exponential
# amplitude decay, and a bright transient click. Public controls remain preset
# aliases while the voice graph is explicit.
instrument:
  id: dandrum.drum-909-kick
  preset_schema_version: 1
ports:
  - { name: decay_ms, direction: input, signal: control, channels: 1, default: 260, min: 40, max: 1200, maps_to: voices.decay_ms }
  - { name: sweep, direction: input, signal: control, channels: 1, default: 0.9, min: 0, max: 3, maps_to: voices.sweep }
  - { name: pitch_decay_ms, direction: input, signal: control, channels: 1, default: 45, min: 5, max: 300, maps_to: voices.pitch_decay_ms }
  - { name: click, direction: input, signal: control, channels: 1, default: 0.8, min: 0, max: 2, maps_to: voices.click }
  - { name: level, direction: input, signal: control, channels: 1, default: 1, min: 0, max: 2, maps_to: voices.level }
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: voices.audio }
preset_surface:
  parameters:
    - { name: kick.decay_ms, maps_to: decay_ms }
    - { name: kick.sweep, maps_to: sweep }
    - { name: kick.pitch_decay_ms, maps_to: pitch_decay_ms }
    - { name: kick.click, maps_to: click }
    - { name: kick.level, maps_to: level }
module_definitions:
  - type: kick_voice
    ports:
      - { name: decay_ms, direction: input, signal: control, channels: 1, default: 260, min: 40, max: 1200, maps_to: amp_env.time_ms }
      - { name: sweep, direction: input, signal: control, channels: 1, default: 0.9, min: 0, max: 3, maps_to: pitch_map.scale }
      - { name: pitch_decay_ms, direction: input, signal: control, channels: 1, default: 45, min: 5, max: 300, maps_to: pitch_env.time_ms }
      - { name: click, direction: input, signal: control, channels: 1, default: 0.8, min: 0, max: 2, maps_to: click_trim.gain }
      - { name: level, direction: input, signal: control, channels: 1, default: 1, min: 0, max: 2, maps_to: body_trim.gain }
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: mixer.mix }
    modules:
      - { id: ntr, type: note_to_control }
      - { id: pitch_env, type: decay, static: { curve: exponential } }
      - { id: pitch_map, type: curve_mapper }
      - { id: body, type: oscillator, static: { waveform: sine, channels: 2 } }
      - { id: amp_env, type: decay, static: { curve: exponential } }
      - { id: body_vca, type: gain, static: { channels: 2 } }
      - { id: body_trim, type: gain, static: { channels: 2 } }
      - { id: click_impulse, type: impulse, static: { channels: 2 } }
      - { id: click_hp, type: filter, static: { algorithm: biquad, mode: highpass, channels: 2 } }
      - { id: click_env, type: decay, static: { curve: exponential }, defaults: { time_ms: 6 } }
      - { id: click_vca, type: gain, static: { channels: 2 } }
      - { id: click_trim, type: gain, static: { channels: 2 } }
      - { id: mixer, type: audio_mixer, static: { channels: 2 } }
    connections:
      - { from: voice.gate, to: ntr.events }
      - { from: voice.gate, to: pitch_env.trigger }
      - { from: voice.gate, to: amp_env.trigger }
      - { from: voice.gate, to: click_impulse.trigger }
      - { from: voice.gate, to: click_env.trigger }
      - { from: pitch_env.value, to: pitch_map.value }
      - { from: ntr.pitch_ratio, to: pitch_map.offset }
      - { from: pitch_map.value, to: body.pitch }
      - { from: body.audio, to: body_vca.audio_in }
      - { from: amp_env.value, to: body_vca.gain }
      - { from: body_vca.audio_out, to: body_trim.audio_in }
      - { from: body_trim.audio_out, to: mixer.inputs }
      - { from: click_impulse.audio, to: click_hp.audio_in }
      - { from: click_hp.audio_out, to: click_vca.audio_in }
      - { from: click_env.value, to: click_vca.gain }
      - { from: click_vca.audio_out, to: click_trim.audio_in }
      - { from: click_trim.audio_out, to: mixer.inputs }
modules:
  - { id: midi, type: midi_input }
  - id: voices
    type: poly
    static: { definition: kick_voice, max_voices: 1, allocation: reject-new }
connections:
  - { from: midi.events, to: voices.notes }
