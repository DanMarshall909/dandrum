metadata:
  name: Drum 808 Cowbell
# Two fixed-pitch square partials pass through highpass filters and share one
# exponential decay. Public preset controls address the voice inputs.
instrument:
  id: dandrum.drum-808-cowbell
  preset_schema_version: 1
ports:
  - { name: tune, direction: input, signal: control, channels: 1, default: 2.45, min: 1, max: 6, maps_to: voices.tune }
  - { name: tune_high, direction: input, signal: control, channels: 1, default: 3.63, min: 1, max: 8, maps_to: voices.tune_high }
  - { name: decay_ms, direction: input, signal: control, channels: 1, default: 180, min: 20, max: 600, maps_to: voices.decay_ms }
  - { name: level, direction: input, signal: control, channels: 1, default: 0.7, min: 0, max: 2, maps_to: voices.level }
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: voices.audio }
preset_surface:
  parameters:
    - { name: cowbell.tune, maps_to: tune }
    - { name: cowbell.tune_high, maps_to: tune_high }
    - { name: cowbell.decay_ms, maps_to: decay_ms }
    - { name: cowbell.level, maps_to: level }
module_definitions:
  - type: cowbell_voice
    ports:
      - { name: tune, direction: input, signal: control, channels: 1, default: 2.45, min: 1, max: 6, maps_to: body_low.pitch }
      - { name: tune_high, direction: input, signal: control, channels: 1, default: 3.63, min: 1, max: 8, maps_to: body_high.pitch }
      - { name: decay_ms, direction: input, signal: control, channels: 1, default: 180, min: 20, max: 600, maps_to: amp_env.time_ms }
      - { name: level, direction: input, signal: control, channels: 1, default: 0.7, min: 0, max: 2, maps_to: low_trim.gain }
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: mixer.mix }
    modules:
      - { id: amp_env, type: decay, static: { curve: exponential } }
      - { id: body_low, type: oscillator, static: { waveform: square, channels: 2 } }
      - { id: low_band, type: filter, static: { algorithm: biquad, mode: highpass, channels: 2 } }
      - { id: low_vca, type: gain, static: { channels: 2 } }
      - { id: low_trim, type: gain, static: { channels: 2 } }
      - { id: body_high, type: oscillator, static: { waveform: square, channels: 2 } }
      - { id: high_band, type: filter, static: { algorithm: biquad, mode: highpass, channels: 2 } }
      - { id: high_vca, type: gain, static: { channels: 2 } }
      - { id: high_trim, type: gain, static: { channels: 2 }, defaults: { gain: 0.5 } }
      - { id: mixer, type: audio_mixer, static: { channels: 2 } }
    connections:
      - { from: voice.gate, to: amp_env.trigger }
      - { from: body_low.audio, to: low_band.audio_in }
      - { from: low_band.audio_out, to: low_vca.audio_in }
      - { from: amp_env.value, to: low_vca.gain }
      - { from: low_vca.audio_out, to: low_trim.audio_in }
      - { from: low_trim.audio_out, to: mixer.inputs }
      - { from: body_high.audio, to: high_band.audio_in }
      - { from: high_band.audio_out, to: high_vca.audio_in }
      - { from: amp_env.value, to: high_vca.gain }
      - { from: high_vca.audio_out, to: high_trim.audio_in }
      - { from: high_trim.audio_out, to: mixer.inputs }
modules:
  - { id: midi, type: midi_input }
  - id: voices
    type: poly
    static: { definition: cowbell_voice, max_voices: 1, allocation: reject-new }
connections:
  - { from: midi.events, to: voices.notes }
