metadata:
  name: Drum 909 Crash
# 909-style crash cymbal. Sampler-backed for the same reason as the hats.
# The referenced asset is a self-authored synthetic placeholder generated by
# scripts/generate-909-placeholder-samples.py; NO proprietary drum-machine
# sample is bundled. Replace the asset path with your own licensed sample for
# production use.
instrument:
  id: dandrum.drum-909-crash
  preset_schema_version: 1
preset_surface:
  parameters:
    - name: crash.level
      type: number
      default: 0.7
      min: 0
      max: 2
      maps_to: trim.gain
render:
  sample_rate_hz: 48000
  block_size_frames: 128
  duration_frames: 96000
assets:
  - id: crash
    kind: sample
    path: ../../assets/drums/909/crash.wav
modules:
  - id: midi
    type: midi_input
  - id: sampler
    type: sampler
    parameters:
      asset: crash
  - id: trim
    type: gain
    parameters:
      gain: 0.7
  - id: mixer
    type: audio_mixer
  - id: out
    type: audio_output
connections:
  - from: midi.events
    to: sampler.trigger
  - from: sampler.audio
    to: trim.audio_in
  - from: trim.audio_out
    to: mixer.inputs
  - from: mixer.mix
    to: out.left
  - from: mixer.mix
    to: out.right
