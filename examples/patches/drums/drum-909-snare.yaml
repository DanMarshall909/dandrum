metadata:
  name: Drum 909 Snare
# A triangle-wave body and filtered noise layer shaped by separate decays.
# Public preset controls address the voice inputs.
instrument:
  id: dandrum.drum-909-snare
  preset_schema_version: 1
ports:
  - { name: tone_level, direction: input, signal: control, channels: 1, default: 0.4, min: 0, max: 1, maps_to: voices.tone_level }
  - { name: tone_decay_ms, direction: input, signal: control, channels: 1, default: 90, min: 10, max: 400, maps_to: voices.tone_decay_ms }
  - { name: snappy, direction: input, signal: control, channels: 1, default: 1, min: 0, max: 2, maps_to: voices.snappy }
  - { name: noise_decay_ms, direction: input, signal: control, channels: 1, default: 160, min: 20, max: 700, maps_to: voices.noise_decay_ms }
  - { name: left, direction: output, signal: audio, channels: 1, maps_from: voices.audio }
  - { name: right, direction: output, signal: audio, channels: 1, maps_from: voices.audio }
preset_surface:
  parameters:
    - { name: snare.tone_level, maps_to: tone_level }
    - { name: snare.tone_decay_ms, maps_to: tone_decay_ms }
    - { name: snare.snappy, maps_to: snappy }
    - { name: snare.noise_decay_ms, maps_to: noise_decay_ms }
module_definitions:
  - type: snare_voice
    ports:
      - { name: tone_level, direction: input, signal: control, channels: 1, default: 0.4, min: 0, max: 1, maps_to: body_trim.gain }
      - { name: tone_decay_ms, direction: input, signal: control, channels: 1, default: 90, min: 10, max: 400, maps_to: body_env.time_ms }
      - { name: snappy, direction: input, signal: control, channels: 1, default: 1, min: 0, max: 2, maps_to: noise_trim.gain }
      - { name: noise_decay_ms, direction: input, signal: control, channels: 1, default: 160, min: 20, max: 700, maps_to: noise_env.time_ms }
      - { name: audio, direction: output, signal: audio, channels: 1, maps_from: mixer.mix }
    modules:
      - { id: ntr, type: note_to_control }
      - { id: body, type: oscillator, static: { waveform: triangle } }
      - { id: body_env, type: decay, static: { curve: exponential } }
      - { id: body_vca, type: gain }
      - { id: body_trim, type: gain }
      - { id: noise, type: noise, static: { seed: 9099 } }
      - { id: noise_hp, type: filter, static: { algorithm: biquad, mode: highpass } }
      - { id: noise_env, type: decay, static: { curve: exponential } }
      - { id: noise_vca, type: gain }
      - { id: noise_trim, type: gain }
      - { id: mixer, type: audio_mixer }
    connections:
      - { from: voice.gate, to: ntr.events }
      - { from: ntr.pitch_ratio, to: body.pitch }
      - { from: voice.gate, to: body_env.trigger }
      - { from: voice.gate, to: noise_env.trigger }
      - { from: body.audio, to: body_vca.audio_in }
      - { from: body_env.value, to: body_vca.gain }
      - { from: body_vca.audio_out, to: body_trim.audio_in }
      - { from: body_trim.audio_out, to: mixer.inputs }
      - { from: noise.audio, to: noise_hp.audio_in }
      - { from: noise_hp.audio_out, to: noise_vca.audio_in }
      - { from: noise_env.value, to: noise_vca.gain }
      - { from: noise_vca.audio_out, to: noise_trim.audio_in }
      - { from: noise_trim.audio_out, to: mixer.inputs }
modules:
  - { id: midi, type: midi_input }
  - id: voices
    type: poly
    static: { definition: snare_voice, max_voices: 1, allocation: reject-new }
connections:
  - { from: midi.events, to: voices.notes }
