metadata:
  name: Drum 909 Closed Hat
# 909-style closed hi-hat. High-frequency metallic transients are a known-hard
# case for primitive synthesis, so this voice is sampler-backed (see the
# drum-voice-authoring design: sampler assets are the permitted fallback for
# 909 hats/crash/ride). The referenced asset is a self-authored synthetic
# placeholder generated by scripts/generate-909-placeholder-samples.py; NO
# proprietary drum-machine sample is bundled. Replace the asset path with your
# own licensed sample for production use.
instrument:
  id: dandrum.drum-909-hat-closed
  preset_schema_version: 1
preset_surface:
  parameters:
    - name: hat.level
      type: number
      default: 0.8
      min: 0
      max: 2
      maps_to: trim.gain
render:
  sample_rate_hz: 48000
  block_size_frames: 128
  duration_frames: 48000
assets:
  - id: hat_closed
    kind: sample
    path: ../../assets/drums/909/hat-closed.wav
modules:
  - id: midi
    type: midi_input
  - id: sampler
    type: sampler
    parameters:
      asset: hat_closed
  - id: trim
    type: gain
    parameters:
      gain: 0.8
  - id: mixer
    type: audio_mixer
  - id: out
    type: audio_output
connections:
  - from: midi.events
    to: sampler.trigger
  - from: sampler.audio
    to: trim.audio_in
  - from: trim.audio_out
    to: mixer.inputs
  - from: mixer.mix
    to: out.left
  - from: mixer.mix
    to: out.right
