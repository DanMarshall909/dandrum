metadata:
  name: Drum 808 Conga
# A tuned sine body with independent pitch and amplitude decays.
# Public preset controls address the voice inputs.
instrument:
  id: dandrum.drum-808-conga
  preset_schema_version: 1
ports:
  - { name: decay_ms, direction: input, signal: control, channels: 1, default: 180, min: 30, max: 600, maps_to: voices.decay_ms }
  - { name: sweep, direction: input, signal: control, channels: 1, default: 0.2, min: 0, max: 1.5, maps_to: voices.sweep }
  - { name: pitch_decay_ms, direction: input, signal: control, channels: 1, default: 40, min: 5, max: 200, maps_to: voices.pitch_decay_ms }
  - { name: level, direction: input, signal: control, channels: 1, default: 0.9, min: 0, max: 2, maps_to: voices.level }
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: voices.audio }
preset_surface:
  parameters:
    - { name: conga.decay_ms, maps_to: decay_ms }
    - { name: conga.sweep, maps_to: sweep }
    - { name: conga.pitch_decay_ms, maps_to: pitch_decay_ms }
    - { name: conga.level, maps_to: level }
module_definitions:
  - type: tuned_drum_voice
    ports:
      - { name: decay_ms, direction: input, signal: control, channels: 1, default: 180, min: 30, max: 600, maps_to: amp_env.time_ms }
      - { name: sweep, direction: input, signal: control, channels: 1, default: 0.2, min: 0, max: 1.5, maps_to: pitch_map.scale }
      - { name: pitch_decay_ms, direction: input, signal: control, channels: 1, default: 40, min: 5, max: 200, maps_to: pitch_env.time_ms }
      - { name: level, direction: input, signal: control, channels: 1, default: 0.9, min: 0, max: 2, maps_to: body_trim.gain }
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: mixer.mix }
    modules:
      - { id: ntr, type: note_to_control }
      - { id: pitch_env, type: decay, static: { curve: exponential } }
      - { id: pitch_map, type: curve_mapper }
      - { id: body, type: oscillator, static: { waveform: sine, channels: 2 } }
      - { id: amp_env, type: decay, static: { curve: exponential } }
      - { id: body_vca, type: gain, static: { channels: 2 } }
      - { id: body_trim, type: gain, static: { channels: 2 } }
      - { id: mixer, type: audio_mixer, static: { channels: 2 } }
    connections:
      - { from: voice.gate, to: ntr.events }
      - { from: voice.gate, to: pitch_env.trigger }
      - { from: voice.gate, to: amp_env.trigger }
      - { from: pitch_env.value, to: pitch_map.value }
      - { from: ntr.pitch_ratio, to: pitch_map.offset }
      - { from: pitch_map.value, to: body.pitch }
      - { from: body.audio, to: body_vca.audio_in }
      - { from: amp_env.value, to: body_vca.gain }
      - { from: body_vca.audio_out, to: body_trim.audio_in }
      - { from: body_trim.audio_out, to: mixer.inputs }
modules:
  - { id: midi, type: midi_input }
  - id: voices
    type: poly
    static: { definition: tuned_drum_voice, max_voices: 1, allocation: reject-new }
connections:
  - { from: midi.events, to: voices.notes }
