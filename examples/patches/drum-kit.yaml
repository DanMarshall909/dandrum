metadata:
  name: Drum Kit
  version: "0.1"
voice_allocation:
  max_voices: 8
  stealing: oldest_active
render:
  sample_rate_hz: 48000
  block_size_frames: 128
  duration_frames: 4096
module_definitions:
  - type: impulse_tone
    inputs:
      - name: events
        signal_type: event
        maps_to:
          - note_controls.events
          - envelope.gate
    outputs:
      - name: audio
        signal_type: audio
        maps_from:
          - velocity_gain.audio_out
    modules:
      - id: note_controls
        type: note_to_control
      - id: tone
        type: oscillator
      - id: envelope
        type: adsr
      - id: envelope_gain
        type: gain
      - id: velocity_gain
        type: gain
    connections:
      - from: note_controls.pitch_ratio
        to: tone.pitch
      - from: tone.audio
        to: envelope_gain.audio_in
      - from: envelope.value
        to: envelope_gain.gain
      - from: envelope_gain.audio_out
        to: velocity_gain.audio_in
      - from: note_controls.velocity
        to: velocity_gain.gain
  - type: impulse_noise
    inputs:
      - name: events
        signal_type: event
        maps_to:
          - note_controls.events
          - envelope.gate
    outputs:
      - name: audio
        signal_type: audio
        maps_from:
          - velocity_gain.audio_out
    modules:
      - id: note_controls
        type: note_to_control
      - id: noise
        type: noise
        parameters:
          seed: 42
      - id: filter
        type: filter
        parameters:
          algorithm: biquad
          mode: lowpass
      - id: envelope
        type: adsr
      - id: envelope_gain
        type: gain
      - id: velocity_gain
        type: gain
    connections:
      - from: noise.audio
        to: filter.audio_in
      - from: filter.audio_out
        to: envelope_gain.audio_in
      - from: envelope.value
        to: envelope_gain.gain
      - from: envelope_gain.audio_out
        to: velocity_gain.audio_in
      - from: note_controls.velocity
        to: velocity_gain.gain
  - type: impulse_layer
    inputs:
      - name: events
        signal_type: event
        maps_to:
          - note_controls.events
          - envelope.gate
    outputs:
      - name: audio
        signal_type: audio
        maps_from:
          - velocity_gain.audio_out
    modules:
      - id: note_controls
        type: note_to_control
      - id: tone
        type: oscillator
      - id: noise
        type: noise
        parameters:
          seed: 38
      - id: filter
        type: filter
        parameters:
          algorithm: biquad
          mode: lowpass
      - id: source_mix
        type: audio_mixer
      - id: envelope
        type: adsr
      - id: envelope_gain
        type: gain
      - id: velocity_gain
        type: gain
    connections:
      - from: note_controls.pitch_ratio
        to: tone.pitch
      - from: tone.audio
        to: source_mix.inputs
      - from: noise.audio
        to: filter.audio_in
      - from: filter.audio_out
        to: source_mix.inputs
      - from: source_mix.mix
        to: envelope_gain.audio_in
      - from: envelope.value
        to: envelope_gain.gain
      - from: envelope_gain.audio_out
        to: velocity_gain.audio_in
      - from: note_controls.velocity
        to: velocity_gain.gain
modules:
  - id: midi
    type: midi_input
  - id: kick_route
    type: event_filter
    parameters:
      selector: note
      note: 60
  - id: snare_route
    type: event_filter
    parameters:
      selector: note
      note: 38
  - id: hat_route
    type: event_filter
    parameters:
      selector: note
      note: 42
  - id: kick
    type: impulse_tone
  - id: snare
    type: impulse_layer
  - id: hat
    type: impulse_noise
  - id: mixer
    type: audio_mixer
  - id: out
    type: audio_output
connections:
  - from: midi.events
    to: kick_route.events_in
  - from: midi.events
    to: snare_route.events_in
  - from: midi.events
    to: hat_route.events_in
  - from: kick_route.events_out
    to: kick.events
  - from: snare_route.events_out
    to: snare.events
  - from: hat_route.events_out
    to: hat.events
  - from: kick.audio
    to: mixer.inputs
  - from: snare.audio
    to: mixer.inputs
  - from: hat.audio
    to: mixer.inputs
  - from: mixer.mix
    to: out.left
  - from: mixer.mix
    to: out.right
