metadata:
  name: Drum Kit
  version: "0.1"
ports:
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: mixer.mix }
  - { name: kick, direction: output, signal: audio, channels: 2, maps_from: kick_voices.audio }
  - { name: snare, direction: output, signal: audio, channels: 2, maps_from: snare_voices.audio }
  - { name: hat, direction: output, signal: audio, channels: 2, maps_from: hat_voices.audio }
module_definitions:
  - type: impulse_tone
    ports:
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: velocity_gain.audio_out }
    modules:
      # The kick route admits only MIDI 36; this is its legacy pitch ratio.
      - { id: tone, type: oscillator, static: { channels: 2 }, defaults: { pitch: 0.2973017692565918 } }
      - { id: tone_filter, type: filter, static: { channels: 2, algorithm: biquad, mode: lowpass } }
      - { id: envelope, type: adsr }
      - { id: envelope_gain, type: gain, static: { channels: 2 } }
      - { id: velocity_gain, type: gain, static: { channels: 2 } }
    connections:
      - { from: voice.gate, to: envelope.gate }
      - { from: tone.audio, to: tone_filter.audio_in }
      - { from: tone_filter.audio_out, to: envelope_gain.audio_in }
      - { from: envelope.value, to: envelope_gain.gain }
      - { from: envelope_gain.audio_out, to: velocity_gain.audio_in }
      - { from: voice.velocity, to: velocity_gain.gain }
  - type: impulse_noise
    ports:
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: velocity_gain.audio_out }
    modules:
      - { id: noise, type: noise, static: { channels: 2, seed: 42 } }
      - { id: filter, type: filter, static: { channels: 2, algorithm: biquad, mode: lowpass } }
      - { id: envelope, type: adsr }
      - { id: envelope_gain, type: gain, static: { channels: 2 } }
      - { id: velocity_gain, type: gain, static: { channels: 2 } }
    connections:
      - { from: voice.gate, to: envelope.gate }
      - { from: noise.audio, to: filter.audio_in }
      - { from: filter.audio_out, to: envelope_gain.audio_in }
      - { from: envelope.value, to: envelope_gain.gain }
      - { from: envelope_gain.audio_out, to: velocity_gain.audio_in }
      - { from: voice.velocity, to: velocity_gain.gain }
  - type: impulse_layer
    ports:
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: velocity_gain.audio_out }
    modules:
      # The snare route admits only MIDI 38; this is its legacy pitch ratio.
      - { id: tone, type: oscillator, static: { channels: 2 }, defaults: { pitch: 0.3337099552154541 } }
      - { id: noise, type: noise, static: { channels: 2, seed: 38 } }
      - { id: filter, type: filter, static: { channels: 2, algorithm: biquad, mode: lowpass } }
      - { id: source_mix, type: audio_mixer, static: { channels: 2 } }
      - { id: envelope, type: adsr }
      - { id: envelope_gain, type: gain, static: { channels: 2 } }
      - { id: velocity_gain, type: gain, static: { channels: 2 } }
    connections:
      - { from: voice.gate, to: envelope.gate }
      - { from: tone.audio, to: source_mix.inputs }
      - { from: noise.audio, to: filter.audio_in }
      - { from: filter.audio_out, to: source_mix.inputs }
      - { from: source_mix.mix, to: envelope_gain.audio_in }
      - { from: envelope.value, to: envelope_gain.gain }
      - { from: envelope_gain.audio_out, to: velocity_gain.audio_in }
      - { from: voice.velocity, to: velocity_gain.gain }
modules:
  - { id: midi, type: midi_input }
  - { id: kick_route, type: event_filter, static: { selector: note, note: 36 } }
  - { id: snare_route, type: event_filter, static: { selector: note, note: 38 } }
  - { id: hat_route, type: event_filter, static: { selector: note, note: 42 } }
  - id: kick_voices
    type: poly
    static: { definition: impulse_tone, max_voices: 8, allocation: oldest-steal }
  - id: snare_voices
    type: poly
    static: { definition: impulse_layer, max_voices: 8, allocation: oldest-steal }
  - id: hat_voices
    type: poly
    static: { definition: impulse_noise, max_voices: 8, allocation: oldest-steal }
  - { id: mixer, type: audio_mixer, static: { channels: 2 } }
connections:
  - { from: midi.events, to: kick_route.events_in }
  - { from: midi.events, to: snare_route.events_in }
  - { from: midi.events, to: hat_route.events_in }
  - { from: kick_route.events_out, to: kick_voices.notes }
  - { from: snare_route.events_out, to: snare_voices.notes }
  - { from: hat_route.events_out, to: hat_voices.notes }
  - { from: kick_voices.audio, to: mixer.inputs }
  - { from: snare_voices.audio, to: mixer.inputs }
  - { from: hat_voices.audio, to: mixer.inputs }
