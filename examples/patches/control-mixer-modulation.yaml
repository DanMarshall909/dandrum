metadata:
  name: Control Mixer Modulation
  version: "0.1"
ports:
  - { name: left, direction: output, signal: audio, channels: 1, maps_from: vca.audio_out }
modules:
  - { id: env, type: adsr }
  - { id: lfo, type: lfo }
  - { id: control_mix, type: control_mixer }
  - { id: osc, type: oscillator }
  - { id: vca, type: gain }
connections:
  - { from: env.value, to: control_mix.inputs }
  - { from: lfo.value, to: control_mix.inputs }
  - { from: control_mix.sum, to: vca.gain }
  - { from: osc.audio, to: vca.audio_in }
