metadata:
  name: Envelope Follower Ducking
ports:
  - name: left
    direction: output
    signal: audio
    channels: 1
    maps_from: vca.audio_out
  - name: right
    direction: output
    signal: audio
    channels: 1
    maps_from: vca.audio_out
modules:
  - id: source
    type: oscillator
  - id: follower
    type: envelope_follower
    static:
      mode: peak
  - id: vca
    type: gain
  - id: mixer
    type: audio_mixer
connections:
  - from: source.audio
    to: follower.audio_in
  - from: source.audio
    to: vca.audio_in
  - from: follower.value
    to: vca.gain
  - from: vca.audio_out
    to: mixer.inputs
