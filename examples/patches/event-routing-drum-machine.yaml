metadata:
  name: Event Routing Drum Machine
  version: "0.1"
ports:
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: mixer.mix }
module_definitions:
  - type: drum_voice
    ports:
      - { name: trigger, direction: input, signal: event, channels: 1, maps_to: env.gate }
      - { name: audio, direction: output, signal: audio, channels: 2, maps_from: vca.audio_out }
    modules:
      - { id: osc, type: oscillator, static: { channels: 2 } }
      - { id: env, type: adsr }
      - { id: vca, type: gain, static: { channels: 2 } }
    connections:
      - { from: osc.audio, to: vca.audio_in }
      - { from: env.value, to: vca.gain }
modules:
  - { id: midi, type: midi_input }
  - { id: kick_route, type: event_filter, static: { selector: note, note: 60 } }
  - { id: snare_route, type: event_filter, static: { selector: note, note: 38 } }
  - { id: hat_route, type: event_filter, static: { selector: note, note: 42 } }
  - { id: kick_voice, type: drum_voice }
  - { id: snare_voice, type: drum_voice }
  - { id: hat_voice, type: drum_voice }
  - { id: mixer, type: audio_mixer, static: { channels: 2 } }
connections:
  - { from: midi.events, to: kick_route.events_in }
  - { from: midi.events, to: snare_route.events_in }
  - { from: midi.events, to: hat_route.events_in }
  - { from: kick_route.events_out, to: kick_voice.trigger }
  - { from: snare_route.events_out, to: snare_voice.trigger }
  - { from: hat_route.events_out, to: hat_voice.trigger }
  - { from: kick_voice.audio, to: mixer.inputs }
  - { from: snare_voice.audio, to: mixer.inputs }
  - { from: hat_voice.audio, to: mixer.inputs }
