metadata:
  name: Composite Reverb
  version: "0.1"
ports:
  - { name: in, direction: input, signal: audio, channels: 2, maps_to: reverb_mod.audio_in }
  - { name: master, direction: output, signal: audio, channels: 2, maps_from: reverb_mod.audio_out }
module_definitions:
  - type: spatial_reverb
    static_params:
      - { name: channels, type: int, default: 2 }
    ports:
      - { name: audio_in, direction: input, signal: audio, channels: $channels, maps_to: reverb.audio_in }
      - { name: decay_time, direction: input, signal: control, channels: 1, default: 0.35, maps_to: reverb.decay_time }
      - { name: room_size, direction: input, signal: control, channels: 1, default: 0.7, maps_to: reverb.room_size }
      - { name: damping, direction: input, signal: control, channels: 1, default: 0.3, maps_to: reverb.damping }
      - { name: stereo_width, direction: input, signal: control, channels: 1, default: 0.5, maps_to: reverb.stereo_width }
      - { name: wet, direction: input, signal: control, channels: 1, default: 0.7, maps_to: reverb.wet }
      - { name: dry, direction: input, signal: control, channels: 1, default: 0.5, maps_to: reverb.dry }
      - { name: audio_out, direction: output, signal: audio, channels: $channels, maps_from: reverb.audio_out }
    modules:
      - { id: reverb, type: reverb, static: { channels: $channels } }
modules:
  - { id: reverb_mod, type: spatial_reverb, static: { channels: 2 } }
connections: []
