metadata:
  name: Composite Impulse Noise
ports:
  - { name: left, direction: output, signal: audio, channels: 1, maps_from: voices.audio }
  - { name: right, direction: output, signal: audio, channels: 1, maps_from: voices.audio }
module_definitions:
  - type: impulse_noise
    ports:
      - { name: audio, direction: output, signal: audio, channels: 1, maps_from: velocity_gain.audio_out }
    modules:
      - { id: note_controls, type: note_to_control }
      - { id: noise, type: noise, static: { seed: 808 } }
      - { id: filter, type: filter, static: { algorithm: biquad, mode: lowpass } }
      - { id: envelope, type: adsr }
      - { id: envelope_gain, type: gain }
      - { id: velocity_gain, type: gain }
    connections:
      - { from: voice.gate, to: note_controls.events }
      - { from: note_controls.gate, to: envelope.gate }
      - { from: noise.audio, to: filter.audio_in }
      - { from: filter.audio_out, to: envelope_gain.audio_in }
      - { from: envelope.value, to: envelope_gain.gain }
      - { from: envelope_gain.audio_out, to: velocity_gain.audio_in }
      - { from: note_controls.velocity, to: velocity_gain.gain }
modules:
  - { id: midi, type: midi_input }
  - id: voices
    type: poly
    static: { definition: impulse_noise, max_voices: 8, allocation: oldest-steal }
connections:
  - { from: midi.events, to: voices.notes }
