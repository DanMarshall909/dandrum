metadata:
  name: Short Tune with Delay
  version: "0.1"
  author: Dandrum
ports:
  - { name: master, direction: output, signal: audio, channels: 1, maps_from: delay.audio_out }
modules:
  - { id: midi, type: midi_input }
  - { id: note, type: note_to_rate }
  - { id: osc, type: oscillator }
  - { id: env, type: adsr }
  - { id: lfo, type: lfo }
  - { id: control_mix, type: control_mixer }
  - { id: vca, type: gain }
  - { id: delay, type: compensation_delay, static: { delay_samples: 128 } }
connections:
  - { from: midi.events, to: note.events }
  - { from: midi.events, to: env.gate }
  - { from: note.rate, to: osc.pitch }
  - { from: env.value, to: control_mix.inputs }
  - { from: lfo.value, to: control_mix.inputs }
  - { from: osc.audio, to: vca.audio_in }
  - { from: control_mix.sum, to: vca.gain }
  - { from: vca.audio_out, to: delay.audio_in }
