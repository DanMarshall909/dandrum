metadata:
  name: Synthetic Hats
ports:
  - name: left
    direction: output
    signal: audio
    channels: 1
    maps_from: mix.mix
  - name: right
    direction: output
    signal: audio
    channels: 1
    maps_from: mix.mix
modules:
  - id: midi
    type: midi_input
  - id: closed_noise
    type: noise
    static:
      seed: 42
  - id: open_noise
    type: noise
    static:
      seed: 46
  - id: closed_env
    type: adsr
  - id: open_env
    type: adsr
  - id: closed_vca
    type: gain
  - id: open_vca
    type: gain
  - id: mix
    type: audio_mixer
connections:
  - from: midi.events
    to: closed_env.gate
  - from: midi.events
    to: open_env.gate
  - from: closed_noise.audio
    to: mix.inputs
  - from: open_noise.audio
    to: mix.inputs
