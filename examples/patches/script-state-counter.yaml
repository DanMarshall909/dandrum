metadata:
  name: Script State Counter
ports:
  - { name: count, direction: output, signal: control, channels: 1, maps_from: note_counter.count }
  - { name: previous_count, direction: output, signal: control, channels: 1, maps_from: note_counter.previous_count }
module_definitions:
  - type: state_counter
    implementation: script
    static_params:
      - { name: language, type: enum, default: rhai, allowed_values: [rhai] }
      - { name: source, type: string }
    ports:
      - { name: events, direction: input, signal: event, channels: 1 }
      - { name: count, direction: output, signal: control, channels: 1 }
      - { name: previous_count, direction: output, signal: control, channels: 1 }
modules:
  - id: midi
    type: midi_input
  - id: note_counter
    type: state_counter
    static:
      source: |
        fn process(ctx) {
          let count = ctx.state_get("count");
          for event in ctx.events {
            if event.type == "note_on" {
              let next = ctx.state_get("count") + 1.0;
              ctx.state_set("count", next);
              ctx.control("count", next);
            }
          }
          if count > 0.0 {
            ctx.control("previous_count", count);
          }
        }
connections:
  - from: midi.events
    to: note_counter.events
