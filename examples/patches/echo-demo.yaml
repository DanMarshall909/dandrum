metadata:
  name: Echo Demo
  version: "0.1"
ports:
  - name: in
    direction: input
    signal: audio
    channels: 2
    maps_to: echo.audio_in
  - name: master
    direction: output
    signal: audio
    channels: 2
    maps_from: echo.audio_out
modules:
  - id: echo
    type: echo
    static: { channels: 2 }
connections: []
