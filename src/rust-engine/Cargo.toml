[package]
name = "dandrum_engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
jsonschema = { version = "0.58.1", default-features = false }
sha2 = "0.10"
tempfile = "3"
rustfft = "6"
num-complex = "0.4"
crossterm = "0.29.0"
rhai = { version = "1", default-features = false, features = ["std", "sync"] }
zip = { version = "8.6.0", default-features = false }

[profile.release]
codegen-units = 1
lto = true
