metadata:
  name: Drum 909 Snare
# 909-style snare: a short tuned body tone under a bright, noise-dominated
# highpassed "snappy" layer. Built from oscillator, decay, noise, filter, and
# gain primitives only. Public controls map to live runtime targets. Seed
# values are tuning hints from public 909 references, refined offline.
instrument:
  id: dandrum.drum-909-snare
  preset_schema_version: 1
preset_surface:
  parameters:
    - name: snare.tone_level
      type: number
      default: 0.4
      min: 0
      max: 1
      maps_to: body_trim.gain
    - name: snare.tone_decay_ms
      type: number
      default: 90
      min: 10
      max: 400
      maps_to: body_env.time_ms
    - name: snare.snappy
      type: number
      default: 1
      min: 0
      max: 2
      maps_to: noise_trim.gain
    - name: snare.noise_decay_ms
      type: number
      default: 160
      min: 20
      max: 700
      maps_to: noise_env.time_ms
render:
  sample_rate_hz: 48000
  block_size_frames: 128
  duration_frames: 48000
modules:
  - id: midi
    type: midi_input
  - id: ntr
    type: note_to_control
  - id: body
    type: oscillator
    parameters:
      waveform: triangle
  - id: body_env
    type: decay
    parameters:
      curve: exponential
  - id: body_vca
    type: gain
  - id: body_trim
    type: gain
    parameters:
      gain: 0.4
  - id: noise
    type: noise
    parameters:
      seed: 9099
  - id: noise_hp
    type: filter
    parameters:
      algorithm: biquad
      mode: highpass
  - id: noise_env
    type: decay
    parameters:
      curve: exponential
  - id: noise_vca
    type: gain
  - id: noise_trim
    type: gain
    parameters:
      gain: 1
  - id: mixer
    type: audio_mixer
  - id: out
    type: audio_output
connections:
  - from: midi.events
    to: ntr.events
  - from: midi.events
    to: body_env.trigger
  - from: midi.events
    to: noise_env.trigger
  - from: ntr.pitch_ratio
    to: body.pitch
  - from: body.audio
    to: body_vca.audio_in
  - from: body_env.value
    to: body_vca.gain
  - from: body_vca.audio_out
    to: body_trim.audio_in
  - from: body_trim.audio_out
    to: mixer.inputs
  - from: noise.audio
    to: noise_hp.audio_in
  - from: noise_hp.audio_out
    to: noise_vca.audio_in
  - from: noise_env.value
    to: noise_vca.gain
  - from: noise_vca.audio_out
    to: noise_trim.audio_in
  - from: noise_trim.audio_out
    to: mixer.inputs
  - from: mixer.mix
    to: out.left
  - from: mixer.mix
    to: out.right
