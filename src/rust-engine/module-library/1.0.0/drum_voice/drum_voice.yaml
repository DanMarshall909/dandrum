ports:
  - name: trigger
    direction: input
    signal: event
    channels: 1
    maps_to: env.gate
  - name: audio
    direction: output
    signal: audio
    channels: 1
    maps_from: vca.audio_out
modules:
  - id: osc
    type: oscillator
  - id: env
    type: adsr
  - id: vca
    type: gain
connections:
  - from: osc.audio
    to: vca.audio_in
  - from: env.value
    to: vca.gain
