ports:
  - name: events
    direction: input
    signal: event
    channels: 1
    maps_to:
      - kick_route.events_in
      - snare_route.events_in
      - hat_route.events_in
  - name: main_left
    direction: output
    signal: audio
    channels: 1
    maps_from: main_mixer.mix
  - name: main_right
    direction: output
    signal: audio
    channels: 1
    maps_from: main_mixer.mix
  - name: kick_left
    direction: output
    signal: audio
    channels: 1
    maps_from: kick_vca.audio_out
  - name: kick_right
    direction: output
    signal: audio
    channels: 1
    maps_from: kick_vca.audio_out
  - name: snare_left
    direction: output
    signal: audio
    channels: 1
    maps_from: snare_vca.audio_out
  - name: snare_right
    direction: output
    signal: audio
    channels: 1
    maps_from: snare_vca.audio_out
  - name: hat_left
    direction: output
    signal: audio
    channels: 1
    maps_from: hat_vca.audio_out
  - name: hat_right
    direction: output
    signal: audio
    channels: 1
    maps_from: hat_vca.audio_out
modules:
  - id: kick_route
    type: event_filter
    static:
      selector: note
      note: 60
  - id: snare_route
    type: event_filter
    static:
      selector: note
      note: 38
  - id: hat_route
    type: event_filter
    static:
      selector: note
      note: 42
  - id: kick_osc
    type: oscillator
  - id: kick_env
    type: adsr
  - id: kick_vca
    type: gain
  - id: snare_osc
    type: oscillator
  - id: snare_env
    type: adsr
  - id: snare_vca
    type: gain
  - id: hat_osc
    type: oscillator
  - id: hat_env
    type: adsr
  - id: hat_vca
    type: gain
  - id: main_mixer
    type: audio_mixer
connections:
  - from: kick_route.events_out
    to: kick_env.gate
  - from: kick_osc.audio
    to: kick_vca.audio_in
  - from: kick_env.value
    to: kick_vca.gain
  - from: snare_route.events_out
    to: snare_env.gate
  - from: snare_osc.audio
    to: snare_vca.audio_in
  - from: snare_env.value
    to: snare_vca.gain
  - from: hat_route.events_out
    to: hat_env.gate
  - from: hat_osc.audio
    to: hat_vca.audio_in
  - from: hat_env.value
    to: hat_vca.gain
  - from: kick_vca.audio_out
    to: main_mixer.inputs
  - from: snare_vca.audio_out
    to: main_mixer.inputs
  - from: hat_vca.audio_out
    to: main_mixer.inputs
