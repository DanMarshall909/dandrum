[package]
name = "dandrum-trigger-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "dandrum_trigger_host"

[dependencies]
dandrum_engine = { path = "../rust-engine" }
dandrum_instrument_session = { path = "../instrument-session" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "=0.3.2"

[dev-dependencies]
tempfile = "3"
allocation-counter = "=0.8.1"

[profile.release]
codegen-units = 1
lto = true
