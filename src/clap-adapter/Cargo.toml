[package]
name = "dandrum_clap_adapter"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
trigger = ["dep:dandrum_trigger_host"]
# Optional GNU Linux/X11 editor used by the opt-in CMake Trigger product.
# Default proof and plain trigger retain their headless contracts.
trigger-editor = ["trigger", "dep:dandrum_trigger_editor", "dep:gtk", "dep:x11rb", "dep:libc", "dep:webkit2gtk", "dep:rtrb", "clack-extensions/gui", "clack-extensions/timer"]

[dependencies]
rtrb = { version = "=0.3.2", optional = true }
dandrum_trigger_host = { package = "dandrum-trigger-host", path = "../trigger-host", optional = true }
dandrum_engine = { path = "../rust-engine" }
clack-plugin = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d" }
clack-extensions = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d", features = ["clack-plugin", "audio-ports", "note-ports", "params", "state", "log"] }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_os = "linux")'.dependencies]
dandrum_trigger_editor = { package = "dandrum-trigger-editor", path = "../trigger-editor", features = ["native-x11"], optional = true }
gtk = { version = "=0.18.2", optional = true }
x11rb = { version = "=0.13.2", default-features = false, optional = true }
webkit2gtk = { version = "=2.0.2", optional = true }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = { version = "=0.2.186", optional = true }

[dev-dependencies]
clap-sys = "=0.5.0"
libloading = "0.8"
tempfile = "3"
clack-host = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d", default-features = false, features = ["libloading"] }
clack-extensions = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d", features = ["clack-host", "gui"] }

[profile.dev.package.dandrum_clap_adapter]
strip = "debuginfo"

[profile.test.package.dandrum_clap_adapter]
strip = "debuginfo"


# Match the retained engine build profile so task dependency artifacts are reusable.
[profile.release]
codegen-units = 1
lto = true
