[package]
name = "dandrum_clap_adapter"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
trigger = ["dep:dandrum_trigger_host"]

[dependencies]
dandrum_trigger_host = { package = "dandrum-trigger-host", path = "../trigger-host", optional = true }
dandrum_engine = { path = "../rust-engine" }
clack-plugin = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d" }
clack-extensions = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d", features = ["clack-plugin", "audio-ports", "note-ports", "params", "state", "log"] }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
libloading = "0.8"
tempfile = "3"
clack-host = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d", default-features = false, features = ["libloading"] }
clack-extensions = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d", features = ["clack-host"] }

[profile.dev.package.dandrum_clap_adapter]
strip = "debuginfo"

[profile.test.package.dandrum_clap_adapter]
strip = "debuginfo"


# Match the retained engine build profile so task dependency artifacts are reusable.
[profile.release]
codegen-units = 1
lto = true
