<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-panel);font-family:var(--font-ui);color:var(--text-primary)}.g{display:grid;gap:8px}.sw{border-radius:4px;height:56px;border:1px solid rgba(255,240,220,.06)}.n{font:600 12px var(--font-ui);margin-top:6px}.h{font:500 11px var(--font-value);color:var(--text-tertiary)}</style></head><body><div class="g" style="grid-template-columns:repeat(8,1fr)"><div><div class="sw" style="background:var(--dd-host)"></div><div class="n">Host</div><div class="h">#5B9DFF · --dd-host</div></div><div><div class="sw" style="background:var(--dd-ok)"></div><div class="n">OK</div><div class="h">#5FD38A · --dd-ok</div></div><div><div class="sw" style="background:var(--dd-warn)"></div><div class="n">Warn</div><div class="h">#E9C15A · --dd-warn</div></div><div><div class="sw" style="background:var(--dd-error)"></div><div class="n">Error</div><div class="h">#F0545E · --dd-error</div></div><div><div class="sw" style="background:var(--dd-host-wash)"></div><div class="n">Host wash</div><div class="h">#1D2330 · --dd-host-wash</div></div><div><div class="sw" style="background:var(--dd-ok-wash)"></div><div class="n">OK wash</div><div class="h">#1B2719 · --dd-ok-wash</div></div><div><div class="sw" style="background:var(--dd-warn-wash)"></div><div class="n">Warn wash</div><div class="h">#2F2814 · --dd-warn-wash</div></div><div><div class="sw" style="background:var(--dd-error-wash)"></div><div class="n">Error wash</div><div class="h">#34181A · --dd-error-wash</div></div></div></body></html>
