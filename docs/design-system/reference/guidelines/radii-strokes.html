-bottom:18px"></div><div class="h">2px<br>focus, mod arc</div></div><div><div style="width:48px;height:3px;background:var(--dd-paper-1);margin-bottom:17px"></div><div class="h">3px<br>track md, pointer</div></div><div><div style="width:48px;height:4px;background:var(--dd-paper-1);margin-bottom:16px"></div><div class="h">4px<br>track lg</div></div></div></body></html>
