<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-panel);font-family:var(--font-ui);color:var(--text-primary)}.g{display:grid;gap:8px}.sw{border-radius:4px;height:56px;border:1px solid rgba(255,255,255,.06)}.n{font:600 12px var(--font-ui);margin-top:6px}.h{font:500 11px var(--font-value);color:var(--text-tertiary)}.lbl{font:600 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--border-hairline)}th{font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;font-size:11px}code{font:500 12px var(--font-value);color:var(--text-secondary)}</style></head><body><div style="display:flex;gap:40px;align-items:center"><div style="display:flex;align-items:center;gap:10px"><span style="font:700 34px var(--font-display);letter-spacing:-.01em">dandrum</span><span style="width:8px;height:8px;border-radius:8px;background:var(--dd-vermilion)"></span><span style="font:700 15px var(--font-ui);letter-spacing:.1em;color:var(--text-secondary)">DAS SAMPLER</span></div><div style="font-size:12px;color:var(--text-secondary);max-width:280px;line-height:1.4">Lowercase Barlow 700 + vermilion dot + product in caps. Placeholder until a real mark exists; do not draw a logo.</div></div></body></html>
