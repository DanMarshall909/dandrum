<!-- @dsCard group="Spacing" viewport="700x150" name="Depth" subtitle="Only two shadows + a 1px cap highlight + recessed wells" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-panel);font-family:var(--font-ui);color:var(--text-primary)}.g{display:grid;gap:8px}.sw{border-radius:4px;height:56px;border:1px solid rgba(255,255,255,.06)}.n{font:600 12px var(--font-ui);margin-top:6px}.h{font:500 11px var(--font-value);color:var(--text-tertiary)}.lbl{font:600 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--border-hairline)}th{font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;font-size:11px}code{font:500 12px var(--font-value);color:var(--text-secondary)}</style></head><body><div style="display:flex;gap:24px"><div><div style="width:120px;height:60px;border-radius:4px;background:var(--dd-ink-5);box-shadow:var(--shadow-cap), var(--highlight-cap);border:1px solid var(--border-hairline)"></div><div class="n">Cap / pad</div><div class="h">0 2 3 · 55% black</div></div><div><div style="width:120px;height:60px;border-radius:4px;background:var(--dd-ink-3);box-shadow:var(--shadow-float);border:1px solid var(--border-hairline)"></div><div class="n">Float (menu)</div><div class="h">0 8 20 · 50% black</div></div><div><div style="width:120px;height:60px;border-radius:4px;background:var(--dd-ink-0);box-shadow:var(--inset-well);border:1px solid var(--border-hairline)"></div><div class="n">Well</div><div class="h">inset 0 1 · 45% black</div></div><div><div style="width:120px;height:60px;border-radius:4px;background:var(--dd-ink-2);box-shadow:none;border:1px solid var(--border-hairline)"></div><div class="n">Panel</div><div class="h">no shadow, hairline border</div></div></div></body></html>
