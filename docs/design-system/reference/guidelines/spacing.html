<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="2-based steps; panels seam at 4, pad gap 6, panel padding 12" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-panel);font-family:var(--font-ui);color:var(--text-primary)}.g{display:grid;gap:8px}.sw{border-radius:4px;height:56px;border:1px solid rgba(255,255,255,.06)}.n{font:600 12px var(--font-ui);margin-top:6px}.h{font:500 11px var(--font-value);color:var(--text-tertiary)}.lbl{font:600 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--border-hairline)}th{font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;font-size:11px}code{font:500 12px var(--font-value);color:var(--text-secondary)}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:2px;height:2px;background:var(--dd-paper-2);border-radius:1px"></div><code>--space-1</code><span class="h">2px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:4px;height:4px;background:var(--dd-paper-2);border-radius:1px"></div><code>--space-2</code><span class="h">4px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:6px;height:6px;background:var(--dd-paper-2);border-radius:1px"></div><code>--space-3</code><span class="h">6px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:8px;background:var(--dd-paper-2);border-radius:1px"></div><code>--space-4</code><span class="h">8px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:12px;height:12px;background:var(--dd-paper-2);border-radius:1px"></div><code>--space-5</code><span class="h">12px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:16px;height:16px;background:var(--dd-paper-2);border-radius:1px"></div><code>--space-6</code><span class="h">16px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:24px;background:var(--dd-paper-2);border-radius:1px"></div><code>--space-7</code><span class="h">24px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:32px;background:var(--dd-paper-2);border-radius:1px"></div><code>--space-8</code><span class="h">32px</span></div></div></body></html>
