<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-panel);font-family:var(--font-ui);color:var(--text-primary)}.g{display:grid;gap:8px}.sw{border-radius:4px;height:56px;border:1px solid rgba(255,255,255,.06)}.n{font:600 12px var(--font-ui);margin-top:6px}.h{font:500 11px var(--font-value);color:var(--text-tertiary)}.lbl{font:600 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--border-hairline)}th{font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;font-size:11px}code{font:500 12px var(--font-value);color:var(--text-secondary)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div><div class="sw" style="background:var(--dd-mod-a);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 14 14" style="fill:#0E0F11"><circle cx="7" cy="7" r="5"/></svg></div><div class="n">A · Teal</div><div class="h">#3FD0C9</div></div><div><div class="sw" style="background:var(--dd-mod-b);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 14 14" style="fill:#0E0F11"><path d="M7 1.5 12.6 12H1.4Z"/></svg></div><div class="n">B · Lilac</div><div class="h">#A98BFF</div></div><div><div class="sw" style="background:var(--dd-mod-c);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 14 14" style="fill:#0E0F11"><rect x="2" y="2" width="10" height="10"/></svg></div><div class="n">C · Lime</div><div class="h">#8EDB5A</div></div><div><div class="sw" style="background:var(--dd-mod-d);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 14 14" style="fill:#0E0F11"><path d="M7 1 13 7 7 13 1 7Z"/></svg></div><div class="n">D · Pink</div><div class="h">#FF85BE</div></div><div><div class="sw" style="background:var(--dd-mod-wash);display:flex;align-items:center;justify-content:center"></div><div class="n">Assign wash</div><div class="h">#1D3433</div></div></div></body></html>
