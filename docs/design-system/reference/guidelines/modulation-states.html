<!-- @dsCard group="Modulation" viewport="700x470" name="Modulation states" subtitle="The seven states every modulatable control must draw — knob and slider" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script src="../tools/dev-bundle-fallback.js"></script>
<style>body{margin:0;background:var(--surface-panel);padding:16px;font-family:var(--font-ui);color:var(--text-primary)}.lbl{font:600 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}.h{font:500 11px var(--font-ui);color:var(--text-tertiary);line-height:1.3}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:5px 6px;font-size:12px;border-bottom:1px solid var(--border-hairline);vertical-align:top}th{font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;font-size:11px}code{font:500 12px var(--font-value);color:var(--text-secondary)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.DandrumDesignSystem_3c2eab;

const { Knob, Slider } = NS;
const states = [
 ['Unassigned','No ring', {}],
 ['Assigning','Dashed ring + teal wash on eligible targets', {assigning:true}],
 ['Assigned · idle','Range arc at 60%', {modulations:[{slot:'A',depth:0.3}]}],
 ['Modulating','Arc 100% + live dot', {modulations:[{slot:'A',depth:0.3,live:0.65}]}],
 ['Host-automated','Blue arc + value, decays 400 ms', {hostAutomated:true}],
 ['Focused','2px ring, 2px offset', {focused:true}],
 ['Disabled','Paper 4, no arcs', {disabled:true}],
];
function App(){ return <div style={{display:'flex',flexDirection:'column',gap:14}}>
 <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4}}>
  {states.map(([n,d,p])=><div key={n} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
   <Knob label="Start" value={0.35} valueText="35 ms" {...p} />
   <div style={{marginTop:6}}><Slider value={0.35} length={80} compact {...p} /></div>
   <span className="lbl" style={{textAlign:'center'}}>{n}</span><span className="h" style={{textAlign:'center'}}>{d}</span>
  </div>)}
 </div>
 <div style={{display:'grid',gridTemplateColumns:'auto auto auto 1fr',gap:20,alignItems:'center',borderTop:'1px solid var(--border-hairline)',paddingTop:12}}>
  <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}><Knob label="2 sources" value={0.5} bipolar valueText="1.000×" modulations={[{slot:'A',depth:0.2,live:0.8},{slot:'B',depth:-0.15}]} /></div>
  <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}><Knob label="4 sources" value={0.4} valueText="40%" modulations={[{slot:'A',depth:0.2},{slot:'B',depth:0.1},{slot:'C',depth:-0.2},{slot:'D',depth:0.3}]} /></div>
  <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}><Knob label="Mod + host" value={0.6} valueText="−3.0 dB" hostAutomated modulations={[{slot:'A',depth:0.2}]} /></div>
  <div className="h" style={{fontSize:12,color:'var(--text-secondary)'}}>Rings: slot 1 outermost, slot 2 inside it. A third or later assignment adds a <b>+N</b> chip beside the label; all assignments are listed in the context menu and tooltip. Host automation tints the value arc only — it never draws a ring, because the plugin cannot see DAW-side modulation sources.</div>
 </div>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
