<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../tools/dev-bundle-fallback.js"></script>
<style>body{margin:0;background:var(--surface-panel);padding:16px}.lbl{font:600 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:6px;align-items:center}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.DandrumDesignSystem_3c2eab;

const { Knob } = NS;
const S = ({t, children}) => <div className="col">{children}<span className="lbl">{t}</span></div>;
function App(){
  const [v,setV]=React.useState(0.62);
  return <div style={{display:'flex',flexDirection:'column',gap:18}}>
    <div className="row">
      <S t="lg 64"><Knob size="lg" label="Pitch" bipolar value={v} onChange={setV} valueText={(0.5+v).toFixed(3)+'×'} /></S>
      <S t="md 48"><Knob size="md" label="Level" value={0.78} valueText="−1.9 dB" /></S>
      <S t="sm 36"><Knob size="sm" label="Pan" bipolar value={0.42} valueText="L16" /></S>
      <S t="xs 28"><Knob size="xs" label="Var" value={0.3} valueText="30%" /></S>
    </div>
    <div className="row">
      <S t="Unassigned"><Knob label="Start" value={0.3} valueText="30 ms" /></S>
      <S t="Assigning"><Knob label="Start" value={0.3} valueText="30 ms" assigning /></S>
      <S t="Assigned idle"><Knob label="Start" value={0.3} valueText="30 ms" modulations={[{slot:'A',depth:0.3}]} /></S>
      <S t="Modulating"><Knob label="Start" value={0.3} valueText="30 ms" modulations={[{slot:'A',depth:0.3,live:0.7},{slot:'B',depth:-0.2,live:0.4}]} /></S>
      <S t="Host-automated"><Knob label="Start" value={0.45} valueText="45 ms" hostAutomated /></S>
      <S t="Focused"><Knob label="Start" value={0.3} valueText="30 ms" focused /></S>
      <S t="Disabled"><Knob label="Start" value={0.3} valueText="30 ms" disabled /></S>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
