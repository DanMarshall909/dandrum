<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/dandrum-design-system-3c2eabed-50f8-48be-a226-2fe7d8a388d3/styles.css">
  <script src="_ds/dandrum-design-system-3c2eabed-50f8-48be-a226-2fe7d8a388d3/_ds_bundle.js"></script>
</helmet>
<div style="width:100%;height:100%;min-width:0;display:flex;flex-direction:column;gap:2px">
  <div ref="{{ m.ref }}" onScroll="{{ m.onScroll }}" style="flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;background:var(--dd-ink-0);border:1px solid var(--dd-line-2);border-radius:2px">
    <div style="position:relative;height:100%;width:{{ m.innerW }}px;touch-action:none">
      <sc-for list="{{ m.whites }}" as="k" hint-placeholder-count="22">
        <div role="button" aria-label="{{ k.title }}" title="{{ k.title }}" onPointerDown="{{ k.down }}" style="position:absolute;top:0;bottom:0;left:{{ k.l }}%;width:{{ k.w }}%;box-sizing:border-box;background:{{ k.bg }};border-right:1px solid var(--dd-ink-2);border-radius:0 0 2px 2px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;padding-bottom:3px">
          <span style="font:600 10px var(--font-value);line-height:1;color:var(--dd-vermilion-lo)">{{ k.pcl }}</span>
          <span style="font:500 10px var(--font-value);line-height:1;color:{{ k.tc }}">{{ k.cl }}</span>
        </div>
      </sc-for>
      <sc-for list="{{ m.blacks }}" as="k" hint-placeholder-count="15">
        <div role="button" aria-label="{{ k.title }}" title="{{ k.title }}" onPointerDown="{{ k.down }}" style="position:absolute;top:0;height:60%;left:{{ k.l }}%;width:{{ k.w }}%;box-sizing:border-box;background:{{ k.bg }};border:1px solid var(--dd-ink-0);border-top:none;border-radius:0 0 2px 2px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;box-shadow:var(--shadow-cap)">
          <span style="font:600 10px var(--font-value);line-height:1;color:var(--dd-paper-2)">{{ k.pcl }}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="flex:none;display:flex;align-items:center;gap:2px;height:16px">
    <x-import component-from-global-scope="DandrumDesignSystem_3c2eab.IconButton" icon="minus" label="Narrower keys" size="sm" variant="ghost" on-click="{{ m.zoomOut }}" hint-size="20px,16px" style="height:16px;width:20px"></x-import>
    <div role="scrollbar" aria-orientation="horizontal" aria-label="Scroll keyboard" onPointerDown="{{ m.trackDown }}" style="position:relative;flex:1;min-width:0;height:16px;cursor:pointer;touch-action:none">
      <div style="position:absolute;left:0;right:0;top:7px;height:1px;background:var(--dd-line-2)"></div>
      <div style="position:absolute;top:5px;height:5px;left:{{ m.thumbL }}%;width:{{ m.thumbW }}%;background:var(--dd-ink-5);border:1px solid var(--dd-line-3);box-sizing:border-box;border-radius:2px" style-hover="background:var(--dd-ink-6)"></div>
    </div>
    <x-import component-from-global-scope="DandrumDesignSystem_3c2eab.IconButton" icon="plus" label="Wider keys" size="sm" variant="ghost" on-click="{{ m.zoomIn }}" hint-size="20px,16px" style="height:16px;width:20px"></x-import>
    <span role="button" tabindex="0" title="{{ m.fitTitle }}" onClick="{{ m.fit }}" style="min-width:36px;text-align:center;font:500 11px var(--font-value);color:var(--dd-paper-3);cursor:pointer">{{ m.label }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;m&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot;}}"></script>
</body>
</html>
