<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 2000 2000">
  <!-- V3's three horizontal strata. Preserve pixels; broad light is a live Slint brush. -->
  <defs>
    <pattern id="fine" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="white" fill-opacity=".07"/>
      <rect y="1" width="1" height="1" fill="black" fill-opacity=".035"/>
    </pattern>
    <pattern id="medium" width="1" height="5" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="black" fill-opacity=".025"/>
    </pattern>
    <pattern id="wide" width="1" height="11" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="white" fill-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="2000" height="2000" fill="url(#wide)"/>
  <rect width="2000" height="2000" fill="url(#medium)"/>
  <rect width="2000" height="2000" fill="url(#fine)"/>
</svg>
