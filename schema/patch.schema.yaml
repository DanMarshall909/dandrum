$schema: https://json-schema.org/draft/2020-12/schema
$id: https://dandrum.local/schema/patch.schema.yaml
# Editor-facing shape validation for the patch document.
# Runtime graph and DSP semantics still live in Rust.
title: Dandrum Patch Schema
type: object
required:
  - metadata
  - render
  - modules
additionalProperties: false
properties:
  metadata:
    $ref: "#/$defs/metadata"
  instrument:
    $ref: "#/$defs/instrumentIdentity"
  preset_surface:
    $ref: "#/$defs/presetSurfaceDeclaration"
  render:
    $ref: "#/$defs/renderSettings"
  assets:
    type: array
    items:
      $ref: "#/$defs/assetDeclaration"
  module_definitions:
    type: array
    items:
      $ref: "#/$defs/moduleDefinitionDeclaration"
  modules:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/moduleDeclaration"
  connections:
    type: array
    items:
      $ref: "#/$defs/connectionDeclaration"
  parameters:
    type: object
    additionalProperties:
      type: object
      additionalProperties:
        $ref: "#/$defs/parameterValue"
  presets:
    type: object
    additionalProperties:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          $ref: "#/$defs/parameterValue"
  # Optional active preset. Declared presets are inert unless selected here.
  selected_preset:
    type: string
    minLength: 1
  voice_allocation:
    $ref: "#/$defs/voiceAllocation"
$defs:
  metadata:
    type: object
    required:
      - name
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
      version:
        type: string
        minLength: 1
      author:
        type: string
        minLength: 1
  instrumentIdentity:
    type: object
    required:
      - id
      - preset_schema_version
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
      preset_schema_version:
        type: integer
        minimum: 1
  presetSurfaceDeclaration:
    type: object
    additionalProperties: false
    properties:
      parameters:
        type: array
        items:
          $ref: "#/$defs/presetParameterTargetDeclaration"
      assets:
        type: array
        items:
          $ref: "#/$defs/presetAssetTargetDeclaration"
  presetParameterTargetDeclaration:
    type: object
    required:
      - name
      - type
      - default
      - maps_to
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
      type:
        type: string
        enum:
          - boolean
          - number
          - integer
          - text
      default:
        $ref: "#/$defs/parameterValue"
      min:
        type: number
      max:
        type: number
      maps_to:
        $ref: "#/$defs/portReference"
  presetAssetTargetDeclaration:
    type: object
    required:
      - name
      - kind
      - default
      - maps_to
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
      kind:
        type: string
        enum:
          - sample
          - script
      default:
        type: string
        minLength: 1
      maps_to:
        $ref: "#/$defs/portReference"
  renderSettings:
    type: object
    required:
      - sample_rate_hz
      - block_size_frames
      - duration_frames
    additionalProperties: false
    properties:
      sample_rate_hz:
        type: integer
        minimum: 1
      block_size_frames:
        type: integer
        minimum: 1
      duration_frames:
        type: integer
        minimum: 1
  assetDeclaration:
    type: object
    required:
      - id
      - kind
      - path
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
      kind:
        type: string
        enum:
          - sample
          - script
      path:
        type: string
        minLength: 1
  portDeclaration:
    type: object
    required:
      - name
      - signal_type
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
      signal_type:
        type: string
        enum:
          - audio
          - control
          - event
  portReference:
    oneOf:
      - type: string
        pattern: "^[^.]+\\.[^.]+$"
      - type: object
        required:
          - module_id
          - port_name
        additionalProperties: false
        properties:
          module_id:
            type: string
            minLength: 1
          port_name:
            type: string
            minLength: 1
  connectionDeclaration:
    type: object
    required:
      - from
      - to
    additionalProperties: false
    properties:
      from:
        $ref: "#/$defs/portReference"
      to:
        $ref: "#/$defs/portReference"
  parameterValue:
    oneOf:
      - type: boolean
      - type: number
      - type: string
  moduleDeclaration:
    type: object
    required:
      - id
      - type
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
      type:
        type: string
        minLength: 1
      inputs:
        type: array
        items:
          $ref: "#/$defs/portDeclaration"
      outputs:
        type: array
        items:
          $ref: "#/$defs/portDeclaration"
      parameters:
        type: object
        additionalProperties:
          $ref: "#/$defs/parameterValue"
  compositeInputDeclaration:
    type: object
    required:
      - name
      - signal_type
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
      signal_type:
        type: string
        enum:
          - audio
          - control
          - event
      maps_to:
        type: array
        items:
          $ref: "#/$defs/portReference"
  compositeOutputDeclaration:
    type: object
    required:
      - name
      - signal_type
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
      signal_type:
        type: string
        enum:
          - audio
          - control
          - event
      maps_from:
        type: array
        items:
          $ref: "#/$defs/portReference"
  compositeBindingDeclaration:
    type: object
    required:
      - name
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
      type:
        type: string
        enum:
          - boolean
          - number
          - string
      default:
        $ref: "#/$defs/parameterValue"
      value:
        $ref: "#/$defs/parameterValue"
      min:
        type: number
      max:
        type: number
      unit:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      required:
        type: boolean
      expression:
        type: string
        minLength: 1
      maps_to:
        type: array
        items:
          $ref: "#/$defs/portReference"
  moduleDefinitionDeclaration:
    type: object
    required:
      - type
    additionalProperties: false
    properties:
      type:
        type: string
        minLength: 1
      inputs:
        type: array
        items:
          $ref: "#/$defs/compositeInputDeclaration"
      outputs:
        type: array
        items:
          $ref: "#/$defs/compositeOutputDeclaration"
      parameters:
        type: array
        items:
          $ref: "#/$defs/compositeBindingDeclaration"
      asset_bindings:
        type: array
        items:
          $ref: "#/$defs/compositeBindingDeclaration"
      modules:
        type: array
        items:
          $ref: "#/$defs/moduleDeclaration"
      connections:
        type: array
        items:
          $ref: "#/$defs/connectionDeclaration"
  voiceAllocation:
    type: object
    required:
      - max_voices
    additionalProperties: false
    properties:
      max_voices:
        type: integer
        minimum: 1
      stealing:
        type: string
        enum:
          - disabled
          - oldest_active
