$schema: https://json-schema.org/draft/2020-12/schema
$id: https://dandrum.local/schema/patch.schema.yaml
title: Dandrum kernel patch
description: Shape of a root graph document. Graph and DSP invariants are validated by the kernel.
type: object
additionalProperties: false
properties:
  metadata: { $ref: '#/$defs/metadata' }
  instrument: { $ref: '#/$defs/instrumentIdentity' }
  preset_surface: { $ref: '#/$defs/presetSurface' }
  static_params:
    type: array
    items: { $ref: '#/$defs/staticParam' }
  ports:
    type: array
    items: { $ref: '#/$defs/port' }
  module_definitions:
    type: array
    items: { $ref: '#/$defs/definition' }
  modules:
    type: array
    items: { $ref: '#/$defs/node' }
  connections:
    type: array
    items: { $ref: '#/$defs/connection' }
$defs:
  name:
    type: string
    minLength: 1
  metadata:
    type: object
    additionalProperties: false
    properties:
      name: { $ref: '#/$defs/name' }
      version: { $ref: '#/$defs/name' }
      author: { $ref: '#/$defs/name' }
  instrumentIdentity:
    type: object
    required: [id, preset_schema_version]
    additionalProperties: false
    properties:
      id: { $ref: '#/$defs/name' }
      preset_schema_version: { type: integer, minimum: 1 }
  presetSurface:
    type: object
    additionalProperties: false
    properties:
      parameters:
        type: array
        items: { $ref: '#/$defs/presetAlias' }
      assets:
        type: array
        items: { $ref: '#/$defs/presetAlias' }
  presetAlias:
    type: object
    required: [name, maps_to]
    additionalProperties: false
    properties:
      name: { $ref: '#/$defs/name' }
      maps_to: { $ref: '#/$defs/name' }
  staticParam:
    type: object
    required: [name, type]
    additionalProperties: false
    properties:
      name: { $ref: '#/$defs/name' }
      type: { enum: [int, enum, string, resource] }
      resource_kind: { enum: [sample, impulse_response] }
      default: { $ref: '#/$defs/staticValue' }
      allowed_values:
        type: array
        items: { type: string }
  resourceRef:
    type: object
    required: [kind, path]
    additionalProperties: false
    properties:
      kind: { enum: [sample, impulse_response] }
      path: { $ref: '#/$defs/name' }
  staticValue:
    oneOf:
      - { type: integer }
      - { type: string }
      - { $ref: '#/$defs/resourceRef' }
      - { type: 'null' }
  port:
    type: object
    required: [name, direction, signal, channels]
    additionalProperties: false
    properties:
      name: { $ref: '#/$defs/name' }
      direction: { enum: [input, output] }
      signal: { enum: [audio, control, event] }
      channels:
        oneOf:
          - { type: integer, minimum: 0 }
          - { $ref: '#/$defs/name' }
      multiplicity: { enum: [single_source, summing] }
      default: { type: [number, 'null'] }
      min: { type: [number, 'null'] }
      max: { type: [number, 'null'] }
      unit: { type: [string, 'null'] }
      maps_to: { $ref: '#/$defs/referenceList' }
      maps_from: { $ref: '#/$defs/referenceList' }
  referenceList:
    oneOf:
      - { type: string }
      - type: array
        items: { type: string }
  node:
    type: object
    required: [id, type]
    additionalProperties: false
    properties:
      id: { $ref: '#/$defs/name' }
      type: { $ref: '#/$defs/name' }
      static:
        type: object
        additionalProperties: { $ref: '#/$defs/staticValue' }
      defaults:
        type: object
        additionalProperties: { type: number }
    allOf:
      - if:
          properties:
            type: { const: poly }
          required: [type]
        then:
          properties:
            static:
              properties:
                definition: { type: string }
                max_voices: { type: integer }
                allocation: { type: string }
  connection:
    type: object
    required: [from, to]
    additionalProperties: false
    properties:
      from: { type: string }
      to: { type: string }
  definition:
    type: object
    required: [type]
    additionalProperties: false
    properties:
      type: { $ref: '#/$defs/name' }
      implementation: { type: string }
      static_params:
        type: array
        items: { $ref: '#/$defs/staticParam' }
      ports:
        type: array
        items: { $ref: '#/$defs/port' }
      modules:
        type: array
        items: { $ref: '#/$defs/node' }
      connections:
        type: array
        items: { $ref: '#/$defs/connection' }
